# ML training and embedding extraction, as a conda environment. This is the primary route:
# rdkit comes from conda-forge, which is how the archived environment installed it.
# torch is installed by pip, which is also how the archive had it.
name: atfp_env
channels:
  - conda-forge
dependencies:
  - python=3.8.18
  - rdkit=2022.03.5
  - numpy=1.22.1
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - scipy=1.7.3
  - matplotlib-base=3.4.3
  - seaborn=0.13.1
  - jupyterlab=4.0.10     # only needed to open the training notebooks
  - pip
  - pip:
      - torch==2.1.2
